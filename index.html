<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/product_stylesheet.css">
    <link rel="stylesheet" href="css/shared_stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+FR+Moderne:wght@100..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Home</title>
</head>
<body>
    <header>
        <div id="logo_box">
            <img src="image/logo2.png" alt="logo">
        </div> 
        <div>
            <button onclick="redirectTo('register.html')" id="register_btn">Register</button>
            <button onclick="redirectTo('login.html')">login</button>
        </div>
    </header>
    <div id="search_box">
        <select  id="search_type">
            <option value="name">Search by Name</option>
            <option value="color">Search by Color</option>
            <option value="material">Search by Material</option>
        </select>
        <input type="text" placeholder="Search...." onkeyup="searchProducts()" id="search_filed">
        <button id="search_btn" onclick="searchProducts()">Search</button>
    </div>
    <div id="products-row"></div>
    <!-- <script src="scripts/product.js"></script> -->
    <script src="scripts/script.js"></script>
</body>
</html>
