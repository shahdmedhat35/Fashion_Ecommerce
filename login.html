<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index_stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+FR+Moderne:wght@100..400&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>   
    <div id="logo_box">
        <img src="image/logo2.png" alt="logo">
    </div>  
    <img src="image/bg2.jpeg" alt="" id="background">
    <form class="form_box">    
        <div class="filed_box">
            <input type="email" placeholder="Email" id="email" class="filed">
        </div>
        <div class="filed_box">
            <input type="password" placeholder="Password" id="password"class="filed">
        </div>
        <div class="filed_box">
            <input type="checkbox"id="remember_me">
            <label for="remember_me">Remember Me</label>
        </div>
        <button type="button" onclick="login()" id="btn">Login</button>
        <p>Don't have an account?<a href="register.html">Register</a></p>    
    </form>
    <script src="scripts/script.js"></script>
</body>
</html>
